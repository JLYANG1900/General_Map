<div class="general-wrapper">
    <h1>大地图 - 自由定义一切</h1>
    
    <!-- 顶部功能面板 -->
    <div class="controls-panel" id="general-controls-panel">
        <div class="controls-panel-header">
            <span>功能面板</span>
            <button id="controls-collapse-btn" class="general-btn small controls-collapse-btn" type="button" onclick="window.GeneralMap.toggleControlsPanel()">收起</button>
        </div>
        <div class="controls-bar" id="general-controls-bar">
            <!-- V3新增：返回上一层按钮 (默认隐藏) -->
            <button id="map-back-btn" class="general-btn danger" style="display:none;" onclick="window.GeneralMap.goBackMap()">
                <svg class="gm-icon gm-icon-back" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                <span>返回上一层</span>
            </button>

            <!-- 编辑开关 -->
            <div class="edit-toggle-wrapper">
                <label class="switch">
                    <input type="checkbox" id="edit-mode-toggle" onchange="window.GeneralMap.toggleEditMode()">
                    <span class="slider round"></span>
                </label>
                <span id="edit-mode-label">
                    <svg class="gm-icon gm-icon-edit" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/></svg>
                    <span>编辑模式</span>
                </span>
            </div>

            <!-- 新增：添加地点按钮 -->
            <button class="general-btn" onclick="window.GeneralMap.addNewPin()">
                <svg class="gm-icon gm-icon-pin" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21s7-5.4 7-12a7 7 0 1 0-14 0c0 6.6 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>
                <span>新增地点</span>
            </button>

            <!-- 数据重置 -->
            <button class="general-btn" onclick="window.GeneralMap.resetData()">
                <svg class="gm-icon gm-icon-reset" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6"/></svg>
                <span>重置数据</span>
            </button>
            
            <!-- [新增] 备份功能 -->
            <button class="general-btn" onclick="window.GeneralMap.exportBackup()">
                <svg class="gm-icon gm-icon-export" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
                <span>导出备份</span>
            </button>
            <button class="general-btn" onclick="document.getElementById('backup-upload').click()">
                <svg class="gm-icon gm-icon-import" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                <span>导入备份</span>
            </button>
            <input type="file" id="backup-upload" style="display:none" accept=".json" onchange="window.GeneralMap.importBackup(this)">

            <!-- 背景更换 -->
            <button class="general-btn" onclick="document.getElementById('bg-upload').click()">
                <svg class="gm-icon gm-icon-folder" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
                <span>更换背景</span>
            </button>
            <input type="file" id="bg-upload" accept="image/*" style="display:none;" onchange="window.GeneralMap.changeBackground(this)">

            <!-- 新增：主题颜色选择器 -->
            <div class="theme-picker-wrapper">
                <span>
                    <svg class="gm-icon gm-icon-palette" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 22a10 10 0 1 1 10-10c0 2.2-1.4 3-3 3h-1.5a1.5 1.5 0 0 0 0 3H18a2 2 0 0 1 0 4h-6Z"/><circle cx="7.5" cy="10" r=".75"/><circle cx="10.5" cy="7" r=".75"/><circle cx="14" cy="7.5" r=".75"/><circle cx="16.5" cy="11" r=".75"/></svg>
                    <span>主题色:</span>
                </span>
                <input type="color" id="theme-color-picker" value="#b38b59" onchange="window.GeneralMap.applyTheme(this.value)" style="border:none; padding:0; background:none; cursor:pointer;">
            </div>
        </div>
    </div>

    <!-- 副标题区域：当前区域信息 -->
    <h2 style="display:flex; align-items:center; justify-content:center; gap:10px;">
        <span id="subtitle-text">双击地标查看详情，长按拖拽移动 (编辑模式下可直接拖拽)</span>
    </h2>

    <!-- 地图容器：内容由 JS 动态生成 -->
    <div class="map-container" id="general-map-container">
        <!-- 动态生成的 Pins 会放在这里 -->
    </div>

    <!-- 通用弹窗容器：内容由 JS 动态生成 -->
    <div id="dynamic-popup" class="general-popup">
        <span class="close-btn" onclick="window.GeneralMap.closeAllPopups()">
            <svg class="gm-icon gm-icon-close" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </span>
        <div id="popup-content"></div>
    </div>

    <!-- 遮罩层 -->
    <div class="popup-overlay" id="general-overlay" onclick="window.GeneralMap.closeAllPopups()"></div>

    <!-- 出行菜单 -->
    <div id="travel-menu-overlay" onclick="if(event.target === this) window.GeneralMap.closeTravelMenu()">
        <div class="travel-menu-box">
            <span class="close-btn" onclick="window.GeneralMap.closeTravelMenu()">
                <svg class="gm-icon gm-icon-close" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </span>
            <div id="travel-title" style="color:var(--theme-color); margin-bottom:20px;">前往目的地</div>
            <div id="travel-content" class="travel-options"></div>
        </div>
    </div>
</div>
